[package]
name = "singularity"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Autonomous Wisent mission supervisor powered by Jeden"
license = "MIT"
repository = "https://github.com/wisent-ai/singularity"
homepage = "https://singularity.wisent.com"

[lib]
name = "singularity"
path = "src/lib.rs"

[[bin]]
name = "singularity"
path = "bin/singularity.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
